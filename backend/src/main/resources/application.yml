server:
  port: 8080

spring:
  application:
    name: kiki-backend

# Cấu hình AI Engine Đa Nền Tảng (Groq / Gemini / Claude / OpenAI)
groq:
  api-key: ${GEMINI_API_KEY:${AI_API_KEY:${GROQ_API_KEY:your_groq_api_key_here}}}
  base-url: https://api.groq.com/openai/v1/chat/completions
  model: ${GROQ_MODEL:openai/gpt-oss-120b}
  temperature: 0.7
  max-tokens: 2500

# Cấu hình Firebase Admin SDK (Chứng thực JWT & FCM Push)
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
  enabled: ${FIREBASE_ENABLED:true}

# Cấu hình chu kỳ thông báo tự động (Mặc định 20:00 mỗi tối)
reminder:
  cron: "0 0 20 * * *"
  enabled: ${REMINDER_ENABLED:true}

logging:
  level:
    com.kiki.backend: DEBUG
    org.springframework.security: INFO
